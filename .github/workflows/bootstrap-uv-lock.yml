name: Validate uv migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check lockfile
        run: uv lock --check

      - name: Sync frozen environment
        run: uv sync --frozen

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Run Ruff
        run: uv run --no-sync ruff check .

      - name: Build distributions with Hatchling
        run: uv build

      - name: Check package extras metadata
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              metadata = archive.read(metadata_name).decode()

          assert "Provides-Extra: dev" not in metadata
          for extra in ("local", "local-cuda", "flashrank"):
              assert f"Provides-Extra: {extra}" in metadata
          assert "Requires-Dist: openai>=1.0.0" in metadata
          print("Package metadata keeps runtime dependencies and user extras; dev is not published.")
          PY

      - name: Build Linux executable
        run: uv run --no-sync pyinstaller vexor.spec
